[workspace]
exclude = ["fuzz"]
members = ["crates/fbfast-native", "crates/fbfast-core", "crates/fbfast-python"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.99"
version = "0.3.0"

[workspace.dependencies]
arrow-array = {version = "=60.1.0", features = ["ffi"]}
arrow-buffer = "=60.1.0"
arrow-schema = "=60.1.0"
base64 = "=0.23.1"
cc = "=1.11.0"
dotenvy = "=0.15.7"
fbfast-core = {path = "crates/fbfast-core"}
fbfast-native = {path = "crates/fbfast-native"}
flume = {version = "=0.12.0", default-features = false, features = ["async"]}
libloading = "=0.9.0"
proptest = "=1.12.0"
pyo3 = {version = "=0.30.1"}
pyo3-async-runtimes = {version = "=0.30.0", features = ["tokio-runtime"]}
serde = {version = "=1.0.229", features = ["derive"]}
serde_json = "=1.0.154"
thiserror = "=2.0.21"
time = {version = "=0.3.55", default-features = false, features = ["std"]}
tokio = {version = "=1.54.1", features = ["rt-multi-thread", "time", "sync"]}
zeroize = "=1.9.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "none"

[profile.dev]
strip = "none"

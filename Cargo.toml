[workspace]
members = ["crates/fbfast-native", "crates/fbfast-core", "crates/fbfast-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]
fbfast-native = { path = "crates/fbfast-native" }
fbfast-core = { path = "crates/fbfast-core" }
libloading = "=0.8.9"
thiserror = "=2.0.17"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
time = { version = "=0.3.44", default-features = false, features = ["std"] }
pyo3 = { version = "=0.27.2" }
pyo3-async-runtimes = { version = "=0.27.0", features = ["tokio-runtime"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "time", "sync"] }
flume = { version = "=0.11.1", default-features = false, features = ["async"] }
cc = "=1.2.46"
dotenvy = "=0.15.7"
proptest = "=1.9.0"
arrow-array = { version = "=60.0.0", features = ["ffi"] }
arrow-buffer = "=60.0.0"
arrow-schema = "=60.0.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

[profile.dev]
strip = "none"


name: Build and test wheels

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Use the installed build toolchain without adding local development components.
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  security:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.99.1'
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Reject RustSec advisories
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

  quality:
    name: Lint, types, docs drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check python scripts tests benchmarks examples
      - run: python -m mypy python/fbfast
      - name: Typed consumer contract
        run: MYPYPATH=python python -m mypy tests/typing/models.py
      - name: Generated guides match their sources
        run: |
          python scripts/gen_config_docs.py --check
          python scripts/gen_llms_full.py --check
          python -m pytest tests/packaging/test_config_docs.py -q
      - run: python scripts/check_structure.py
      - run: cargo fmt --all --check

  native-safety:
    name: Native sanitizers and fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.99.1'
      - name: Fetch verified Firebird SDK
        run: python scripts/download_sdk.py
      - name: Install Firebird client runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes libtommath1
      - name: Exercise C++ bridge with ASan and UBSan
        run: python scripts/test_sanitizers.py
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run deterministic parser fuzz smoke
        run: |
          cargo +nightly-2026-10-15 fuzz run sql_validation -- -runs=2000
          cargo +nightly-2026-10-15 fuzz run metadata -- -runs=2000
          cargo +nightly-2026-10-15 fuzz run status -- -runs=2000

  desktop:
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2022]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Enter the MSVC x64 developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Replaces the unmaintained ilammy/msvc-dev-cmd: locate VS with vswhere,
          # run vcvars64.bat once and export only the variables it changed.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'Visual Studio with the x64 MSVC tools was not found' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with $LASTEXITCODE" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Select MSVC linker instead of Git Bash link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $linker = Join-Path (Split-Path $compiler) 'link.exe'
          if (!(Test-Path $linker)) { throw "MSVC linker not found: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.99.1'
      - name: Check release version
        run: python scripts/check_release.py
      - name: Install build tools
        run: python -m pip install maturin==1.16.0 wheel==0.48.0 pefile==2024.8.26
      - name: Fetch verified SDK without system installation
        run: python scripts/download_sdk.py
      - name: Core and native unit/property tests
        if: matrix.python == '3.14'
        run: cargo test -p fbfast-core -p fbfast-native --lib --tests
      - name: Build bundled wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: python scripts/build_vendor.py --release --out dist/vendor
      - name: Verify copied runtime in isolated process
        run: python scripts/verify_vendor.py --package dist/vendor/fbfast
      - name: Install exact wheel and analytical consumers
        run: python -m pip install dist/wheels/*.whl pyarrow==26.0.1 polars==2.1.0 pydantic==2.14.2 pytest==9.2.0 mypy==2.4.1
      - name: Test typed row adaptation and the public API surface
        run: python -m pytest tests/models/test_models.py tests/models/test_api_surface.py -q
      - name: Stub and generated API reference match the installed extension
        if: matrix.python == '3.14'
        run: |
          python -m mypy.stubtest fbfast._native --allowlist scripts/stubtest_allowlist.txt --ignore-unused-allowlist
          python scripts/gen_api_docs.py --check
      - name: Query disposable local Firebird using installed wheel, then run the examples
        run: python scripts/ci_smoke.py --sdk "$FBFAST_CLIENT_ROOT" --examples examples
      - name: Verify bundled 5.0.3 client against Firebird 5.0.4 server
        if: matrix.python == '3.14'
        run: |
          server_root="$(python scripts/download_sdk.py --manifest scripts/release_assets_5.0.4.json --out .tools/firebird-server-5.0.4 --no-export)"
          python scripts/ci_smoke.py --sdk "$server_root"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheels-${{ matrix.runner }}-${{ matrix.python }}
          path: dist/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['311', '312', '313', '314', '315']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select CPython with the GIL
        run: echo "/opt/python/cp${{ matrix.python }}-cp${{ matrix.python }}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.99.1'
      - name: Check release version
        run: python scripts/check_release.py
      - name: Install SDK dependencies and build tools
        run: |
          dnf install -y libicu-devel libtommath
          python -m pip install maturin==1.16.0 wheel==0.48.0 auditwheel==6.8.2 patchelf==0.17.2.4
      - name: Fetch verified SDK
        run: python scripts/download_sdk.py
      - name: Core and native unit/property tests
        if: matrix.python == '314'
        run: cargo test -p fbfast-core -p fbfast-native --lib --tests
      - name: Build and audit complete manylinux wheel
        run: python scripts/build_vendor.py --release --out dist/vendor
      - name: Verify copied runtime in isolated process
        run: python scripts/verify_vendor.py --package dist/vendor/fbfast
      - name: Install exact wheel and analytical consumers
        run: python -m pip install dist/wheels/*.whl pyarrow==26.0.1 polars==2.1.0 pydantic==2.14.2 pytest==9.2.0 mypy==2.4.1
      - name: Test typed row adaptation and the public API surface
        run: python -m pytest tests/models/test_models.py tests/models/test_api_surface.py -q
      - name: Stub and generated API reference match the installed extension
        if: matrix.python == '3.14'
        run: |
          python -m mypy.stubtest fbfast._native --allowlist scripts/stubtest_allowlist.txt --ignore-unused-allowlist
          python scripts/gen_api_docs.py --check
      - name: Query disposable local Firebird using installed wheel, then run the examples
        run: python scripts/ci_smoke.py --sdk "$FBFAST_CLIENT_ROOT" --examples examples
      - name: Verify bundled 5.0.3 client against Firebird 5.0.4 server
        if: matrix.python == '314'
        run: |
          server_root="$(python scripts/download_sdk.py --manifest scripts/release_assets_5.0.4.json --out .tools/firebird-server-5.0.4 --no-export)"
          python scripts/ci_smoke.py --sdk "$server_root"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheels-linux-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.99.1'
      - run: python scripts/check_release.py
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build --sdist --outdir dist/sdist
      - run: python -m twine check dist/sdist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sdist
          path: dist/sdist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

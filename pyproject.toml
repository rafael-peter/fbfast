[build-system]
requires = ["maturin==1.16.0", "wheel==0.48.0", "pefile==2024.8.26; sys_platform == 'win32'", "patchelf==0.17.2.4; sys_platform == 'linux'", "auditwheel==6.8.2; sys_platform == 'linux'"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "fbfast"
version = "0.3.0"
description = "Read-only Firebird 5 client with a Rust execution core"
requires-python = ">=3.11,<3.16"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["firebird", "database", "sql", "arrow", "polars", "read-only"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
  "Typing :: Typed",
]
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/rafael-peter/fbfast"
Documentation = "https://github.com/rafael-peter/fbfast/tree/main/docs/guide"
Source = "https://github.com/rafael-peter/fbfast"
Issues = "https://github.com/rafael-peter/fbfast/issues"
Changelog = "https://github.com/rafael-peter/fbfast/tree/main/docs/releases"

[project.optional-dependencies]
pydantic = ["pydantic>=2,<3"]
arrow = ["pyarrow>=26"]
polars = ["polars>=2"]

[tool.maturin]
manifest-path = "crates/fbfast-python/Cargo.toml"
python-source = "python"
module-name = "fbfast._native"
profile = "release"
# Local bytecode caches must never reach a wheel or sdist (verify_vendor checks).
exclude = ["python/fbfast/**/__pycache__/**", "python/fbfast/**/*.pyc"]
include = [
  { path = "build_backend.py", format = "sdist" },
  { path = "scripts/*.py", format = "sdist" },
  { path = "scripts/*.json", format = "sdist" },
  { path = "third_party/licenses/**/*", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "python/fbfast/_runtime/**/*", format = "wheel" },
  { path = "python/fbfast/_licenses/**/*", format = "wheel" },
  { path = "python/fbfast/_build_info.json", format = "wheel" },
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "build_backend.py" },
  { file = "Cargo.lock" },
  { file = "Cargo.toml" },
  { file = "rust-toolchain.toml" },
  { file = "LICENSE-*" },
  { file = "crates/**/*" },
  { file = "python/**/*.py" },
  { file = "python/**/*.pyi" },
  { file = "scripts/*.py" },
  { file = "third_party/licenses/**/*" },
  { env = "FBFAST_CLIENT_ROOT" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff 0.16 enabled a much larger default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true

